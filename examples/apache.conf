Listen 8080

LoadModule wsgi_module /usr/local/lib64/python3.9/site-packages/mod_wsgi/server/mod_wsgi-py39.cpython-39-x86_64-linux-gnu.so

WSGIDaemonProcess htcondor_autoscale processes=1 threads=5
WSGIProcessGroup htcondor_autoscale

<VirtualHost *:8080>

 <Directory /wsgi>
   Require all granted
 </Directory>

  WSGIScriptAlias / /wsgi/htcondor_autoscale.wsgi

</VirtualHost>
